imports:
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Wrk/wrk.yml
  - https://github.com/aspnet/Benchmarks/blob/main/scenarios/aspnet.profiles.yml?raw=true

jobs:
  aspnet:
    source:
      repository: https://github.com/sebastienros/FrameworkBenchmarks.git # todo: change back to TechEmpower
      branchOrCommit: sebros/net60 # todo: change back to master
      dockerContextDirectory: frameworks/CSharp/aspnetcore/
    readyStateText: Application started.

  postgresql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/postgres/postgres.dockerfile
      dockerImageName: postgres_te
      dockerContextDirectory: toolset/databases/postgres
    readyStateText: ready to accept connections
    noClean: true

  mysql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/mysql/mysql.dockerfile
      dockerImageName: mysql_te
      dockerContextDirectory: toolset/databases/mysql
    readyStateText: ready for connections
    noClean: true

scenarios:

  plaintext:
    application:
      job: aspnet
      source:
          dockerFile: frameworks/CSharp/aspnetcore/aspcore.dockerfile
          dockerImageName: aspcore
    load:
      job: wrk
      variables:
        presetHeaders: plaintext
        path: /plaintext
        pipeline: 16
        serverPort: 8080

  json:
    application:
      job: actix
      source:
          dockerFile: frameworks/CSharp/aspnetcore/aspcore.dockerfile
          dockerImageName: aspcore
    load:
      job: wrk
      variables:
        presetHeaders: json
        path: /json
        serverPort: 8080

  fortunes:
    db:
      job: postgresql
    application:
      job: aspnet
      source:
          dockerFile: frameworks/CSharp/aspnetcore/aspcore-ado-pg.dockerfile
          dockerImageName: aspcore-ado-pg
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes/raw
        serverPort: 8080
        
  fortunes_mysql:
    db:
      job: mysql
    application:
      job: aspnet
      source:
          dockerFile: frameworks/CSharp/aspnetcore/aspcore-ado-my.dockerfile
          dockerImageName: aspcore-ado-my
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes/raw
        serverPort: 8080
