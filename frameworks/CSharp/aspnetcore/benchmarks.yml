imports:
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Wrk/wrk.yml
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Bombardier/bombardier.yml
  - https://github.com/aspnet/Benchmarks/blob/main/scenarios/aspnet.profiles.yml?raw=true

jobs:

  platform:
    source:
      repository: https://github.com/sebastienros/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: frameworks/CSharp/aspnetcore/aspnetcore.dockerfile
      dockerImageName: plaatform
      dockerContextDirectory: frameworks/CSharp/aspnetcore/
    readyStateText: Application started
    arguments: --add-host="tfb-database:{{databaseServer}}"

  platform_pgclient:
    source:
      repository: https://github.com/sebastienros/FrameworkBenchmarks.git
      branchOrCommit: sebros/pgclient
      dockerFile: frameworks/CSharp/aspnetcore/aspnetcore-pgclient.dockerfile
      dockerImageName: platform_pgclient
      dockerContextDirectory: frameworks/CSharp/aspnetcore/
    readyStateText: Application started
    arguments: --add-host="tfb-database:{{databaseServer}}"

  minimal:
    source:
      repository: https://github.com/sebastienros/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: frameworks/CSharp/aspnetcore/aspnetcore-minimal.dockerfile
      dockerImageName: minimal
      dockerContextDirectory: frameworks/CSharp/aspnetcore/
    readyStateText: Application started
    arguments: --add-host="tfb-database:{{databaseServer}}"

  minimal_pgclient:
    source:
      repository: https://github.com/sebastienros/FrameworkBenchmarks.git
      branchOrCommit: sebros/pgclient
      dockerFile: frameworks/CSharp/aspnetcore/aspnetcore-minimal-pgclient.dockerfile
      dockerImageName: minimal_pgclient
      dockerContextDirectory: frameworks/CSharp/aspnetcore/
    readyStateText: Application started
    arguments: --add-host="tfb-database:{{databaseServer}}"

  postgresql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/postgres/postgres.dockerfile
      dockerImageName: postgres_te
      dockerContextDirectory: toolset/databases/postgres
    readyStateText: ready to accept connections
    noClean: true
    
scenarios:

# Platform
  
  fortunes_platform:
    db:
      job: postgresql
    application:
      job: platform
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        serverPort: 8080

  
  fortunes_platform_pgclient:
    db:
      job: postgresql
    application:
      job: platform_pgclient
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        serverPort: 8080

# Minimal

  fortunes_minimal:
    db:
      job: postgresql
    application:
      job: minimal
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        serverPort: 8080

  fortunes_minimal_pgclient:
    db:
      job: postgresql
    application:
      job: minimal_pgclient
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        serverPort: 8080
